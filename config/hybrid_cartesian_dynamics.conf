# Starting values for hardware-free verification. Validate for the arm and tooling.
target_position = [0.0, 1.164, 0.0, 2.026, 0.0, 0.0, 0.0]; # rad, joint order 1–7

x_distance = 0.3;           # m along base x from the settled target pose, matching FP
duration = 36.0;            # s, move duration or sine startup blend
position_pattern = "sine";  # "move" or "sine"
position_amplitude = 0.20;  # m, one-sided sine amplitude
position_period = 24.0;     # s, sine period
motion_kp = 400.0;          # 1/s^2
motion_kd = 26.0;           # 1/s
motion_ki = 20.0;           # 1/s^3, active during the final x hold
motion_integral_acceleration_limit = 6.0; # m/s^2, bound on the x integral contribution
max_x_acceleration = 8.0;   # m/s^2

z_force = -10.0;           # N, robot-on-environment along base z, matching FP
force_ramp_duration = 2.0; # s, smooth ramp from zero while holding the starting x reference
force_kp = 0.50;
force_ki = 0.125;           # 1/s
force_integral_limit = 25.0; # N*s
force_filter_hz = 20.0;
z_force_feedback_limit = 20.0; # N, clip filtered z feedback to +/- this value
max_contact_force = 100.0;      # N, measured force norm and normal force-command bound during c

max_joint_speed = 0.5;      # rad/s, measured joint-speed limit during c
hold_zero_tolerance = 0.05; # rad, maximum held-joint displacement from zero during c
joint_torque_limits = [50.0, 40.0, 30.0, 30.0, 5.0, 5.0, 5.0]; # Nm during c, including gravity
